name: CI

on:
  pull_request:
  push:
    branches: [develop, qa, staging, release, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and assemble (Linux and macOS)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Test, lint and assemble (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ matrix.os }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload unit test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
